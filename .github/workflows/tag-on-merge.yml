name: Tag on merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag with today's date
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          N=$(git tag -l "${TODAY}-v*" | sed "s/^${TODAY}-v//" | sort -n | tail -1)
          if [ -z "$N" ]; then N=1; else N=$((N + 1)); fi

          TAG="${TODAY}-v${N}"
          git tag "$TAG"
          git push origin "$TAG"

          echo "Tagged \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
