name: Tag on merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag with today's date and update the docs
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          N=$(git tag -l "${TODAY}-v*" | sed "s/^${TODAY}-v//" | sort -n | tail -1)
          if [ -z "$N" ]; then N=1; else N=$((N + 1)); fi

          TAG="${TODAY}-v${N}"
          git tag "$TAG"
          git push origin "$TAG"

          sed -i -E \
            "s|standards-review\.yml@[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+|standards-review.yml@${TAG}|g; \
             s|\`@[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+\`|\`@${TAG}\`|g" \
            README.md \
            agent-instructions/README.md \
            agent-instructions/caller-workflow.yml

          echo "Tagged \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "Point docs at $TAG"
          git push origin HEAD:main
