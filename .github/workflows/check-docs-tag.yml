name: Check docs tag

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the pinned tag in the docs
        run: |
          FILES="README.md agent-instructions/README.md agent-instructions/caller-workflow.yml"

          if grep -qE 'standards-review\.yml@main' $FILES; then
            echo "::error::An example pins @main. Pin a dated tag and leave main to the trailing comment."
            exit 1
          fi

          FOUND=$(grep -hoE 'standards-review\.yml@[0-9]{4}-[0-9]{2}-[0-9]{2}-v[0-9]+' $FILES | sed 's/.*@//' | sort -u)

          if [ -z "$FOUND" ]; then
            echo "::error::No pinned tag found in the setup examples."
            exit 1
          fi

          if [ "$(echo "$FOUND" | wc -l)" -ne 1 ]; then
            echo "::error::Docs disagree on the pinned tag: $(echo $FOUND)"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$FOUND" > /dev/null; then
            echo "::error::Docs pin $FOUND, which is not a tag in this repo."
            exit 1
          fi

          echo "Docs pin $FOUND"
