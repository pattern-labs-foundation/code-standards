name: Standards Review

on:
  workflow_call:
    inputs:
      standards_ref:
        description: 'Branch/tag/SHA of the standards to enforce. Defaults to the same version as this workflow.'
        type: string
        required: false
        default: ''
      fail_on_violation:
        description: 'Fail the check when a blocking violation is found.'
        type: boolean
        required: false
        default: true
      comment_on_pr:
        description: 'Post the findings as a PR comment.'
        type: boolean
        required: false
        default: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the coding standards
        uses: actions/checkout@v4
        with:
          repository: pattern-labs-foundation/code-standards
          ref: ${{ inputs.standards_ref != '' && inputs.standards_ref || github.job_workflow_sha }}
          path: .standards

      - name: Collect changed files
        run: git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD > changed.txt

      - name: Run standards checks
        id: check
        run: |
          : > findings.tsv
          mapfile -t CHANGED < changed.txt

          if [ "${#CHANGED[@]}" -gt 0 ]; then
            bash .standards/scripts/review-csharp.sh findings.tsv "${CHANGED[@]}"
            bash .standards/scripts/review-terraform.sh findings.tsv "${CHANGED[@]}"
          fi

          set +e
          bash .standards/scripts/format-findings.sh \
            findings.tsv review.md \
            "https://github.com/pattern-labs-foundation/code-standards"
          echo "has_blocking=$?" >> "$GITHUB_OUTPUT"
          set -e

          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ inputs.comment_on_pr }}
        continue-on-error: true # forked-PR tokens are read-only, findings still land in the job summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md

      - name: Fail on blocking violations
        if: ${{ inputs.fail_on_violation && steps.check.outputs.has_blocking == '1' }}
        run: |
          echo "::error::Blocking coding-standards violations found. See the PR comment or job summary."
          exit 1
